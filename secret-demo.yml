name: GitHub Secrets Demo

on:
  push:
    branches:
      - main

jobs:
  secret-test:
    runs-on: ubuntu-latest

    steps:
      - name: Use Secret Safely
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "GitHub Actions workflow started."
          echo "API key has been loaded securely."
          echo "Secret value is NOT displayed."
